<!--
  Bản ăn theo màu chữ — dùng khi đặt logo lên nền CÓ SẴN: đầu thư, hợp đồng in
  ra, con dấu, áo đồng phục, slide.

  Khác `logo.svg` đúng một điểm: phần teal ở đây là `currentColor`, nên thả vào
  chỗ nào là ăn màu chữ chỗ đó (in đen trắng ra đen, đặt trên nền teal đậm thì
  set màu trắng). Lỗ khóa giữ nguyên hổ phách — đó là màu thương hiệu, không
  phải màu trang trí. In một màu thì xóa hai hình cuối, hình vẫn đọc được.

  App KHÔNG đọc file này: giao diện dựng lại cùng hình bằng React ở
  `src/components/common/logo.tsx` để ăn theo kích thước và khỏi tốn một request.

  Nguồn sinh icon là `logo.svg`, không phải file này. Sửa hình thì sửa cả ba nơi.
-->
