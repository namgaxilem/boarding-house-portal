  <path
    d="M76 258 L256 96 L436 258"
    fill="none"
    stroke="currentColor"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M206 306 V264 a50 50 0 0 1 100 0 V306"
    fill="none"
    stroke="currentColor"
    stroke-width="34"
  />
  <rect x="156" y="294" width="200" height="154" rx="30" fill="currentColor" />

  <circle cx="256" cy="355" r="24" fill="#f6b93b" />
  <rect x="246" y="355" width="20" height="56" rx="6" fill="#f6b93b" />
</svg>
