name: Backup database

# Supabase free tier KHÔNG có backup tự động. Mất dữ liệu người thuê là mất thật.
# Job này dump toàn bộ database hàng tuần và giữ artifact 90 ngày.
#
# Cần secret DATABASE_URL:
#   Supabase Dashboard > Project Settings > Database > Connection string > URI
on:
  schedule:
    - cron: "0 2 * * 0" # 02:00 UTC Chủ nhật
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Thiếu secret DATABASE_URL"; exit 1; }
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            --file "backup/nhatro-$(date -u +%Y%m%d).sql"
          ls -lh backup

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
