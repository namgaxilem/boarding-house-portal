name: Keep Supabase awake

# Supabase free tier tự pause project sau 7 ngày không có hoạt động.
# Job này ping mỗi ngày để tránh phải vào dashboard restore thủ công.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC ~ 10:17 giờ VN
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/keep-alive")
          echo "HTTP $code"
          test "$code" = "200"
